<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid Black Background -->
  <rect width="512" height="512" fill="#000000" />
  
  <!-- Dumbbell -->
  <!-- Group scaled and centered to fill the space nicely -->
  <g transform="translate(18, 18) scale(0.93)">
    <!-- Light gray/cream outline with yellow fill -->
    <g fill="#FACC15" stroke="#E5E5E5" stroke-width="14" stroke-linejoin="round">
      <!-- Center Bar -->
      <rect x="156" y="226" width="200" height="40" rx="8" />
      
      <!-- Left side weights -->
      <rect x="110" y="150" width="56" height="192" rx="20" />
      <rect x="66" y="174" width="36" height="144" rx="16" />
      <rect x="40" y="200" width="20" height="92" rx="10" />
      <rect x="22" y="218" width="12" height="56" rx="6" />
      
      <!-- Right side weights -->
      <rect x="346" y="150" width="56" height="192" rx="20" />
      <rect x="410" y="174" width="36" height="144" rx="16" />
      <rect x="452" y="200" width="20" height="92" rx="10" />
      <rect x="478" y="218" width="12" height="56" rx="6" />
    </g>
  </g>
</svg>
